version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres_FerdinanMahrus
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "22${NIM_LAST3}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_FerdinanMahrus
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "44${NIM_LAST3}:80"
    depends_on:
      - postgres

volumes:
  pgdata:
